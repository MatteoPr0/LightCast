<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LightCast Receiver</title>
  <script src="qrcode.min.js"></script>
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(22, 27, 46, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient background */
    .ambient-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.18) 0%, transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.18) 0%, transparent 50%),
                  radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.1) 0%, transparent 70%);
      animation: ambientPulse 12s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { transform: scale(1) rotate(0deg); opacity: 0.8; }
      50% { transform: scale(1.08) rotate(1deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 0.8; }
    }

    /* Standby Dashboard */
    #dashboard-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 64px;
      transition: opacity 0.5s ease, transform 1s ease;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .brand-icon svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    .brand-name {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .device-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      font-size: 1rem;
      color: #34d399;
      backdrop-filter: blur(12px);
    }

    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: dotPulse 2s infinite;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Main Center Card */
    .center-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 48px;
    }

    .left-hero {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
    }

    .clock-display {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      background: linear-gradient(180deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-variant-numeric: tabular-nums;
    }

    .date-display {
      font-size: 1.4rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: capitalize;
    }

    .status-text {
      margin-top: 16px;
      font-size: 1.25rem;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Right QR Card */
    .qr-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      text-align: center;
    }

    .qr-frame {
      padding: 12px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-instructions {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .url-badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid var(--accent);
      border-radius: 12px;
      font-size: 1.05rem;
      font-family: monospace;
      color: #a5b4fc;
    }

    /* Footer info */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Media Player View */
    #player-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 20;
      background: black;
      display: none;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #image-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    /* Player OSD Overlay */
    .player-osd {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 60px;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.85) 100%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .player-osd.visible {
      opacity: 1;
    }

    .osd-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .osd-title {
      font-size: 1.8rem;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .osd-bottom {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .osd-timeline {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .osd-progress-bg {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    .osd-progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      border-radius: 4px;
    }

    .osd-time {
      font-size: 1.1rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>

  <!-- 1. STANDBY DASHBOARD -->
  <div id="dashboard-view">
    <div class="top-bar">
      <div class="brand-box">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        </div>
        <div class="brand-name">LightCast</div>
      </div>

      <div class="device-tag">
        <div class="live-dot"></div>
        <span id="tv-device-name">LightCast TV</span>
      </div>
    </div>

    <div class="center-content">
      <div class="left-hero">
        <div id="clock" class="clock-display">00:00</div>
        <div id="date" class="date-display">Caricamento...</div>
        <div class="status-text">
          <span>Pronto a ricevere video, musica e file multimediali</span>
        </div>
      </div>

      <div class="qr-card">
        <div id="qrcode-container" class="qr-frame"></div>
        <div class="qr-instructions">Inquadra per trasmettere</div>
        <div id="url-label" class="url-badge">http://...</div>
      </div>
    </div>

    <div class="footer-bar">
      <span id="ip-info">IP: Inizializzazione...</span>
      <span>Premi il tasto Indietro sul telecomando per uscire</span>
    </div>
  </div>

  <!-- 2. FULLSCREEN MEDIA PLAYER -->
  <div id="player-view">
    <video id="main-video" preload="auto" playsinline></video>
    <img id="image-player" alt="Cast image">

    <!-- Player OSD Overlay -->
    <div id="player-osd" class="player-osd">
      <div class="osd-top">
        <div id="osd-media-title" class="osd-title">Riproduzione in corso</div>
        <div class="device-tag" style="background:rgba(0,0,0,0.6);">
          <div class="live-dot"></div>
          <span>In Streaming</span>
        </div>
      </div>

      <div class="osd-bottom">
        <div class="osd-timeline">
          <span id="osd-current-time" class="osd-time">00:00</span>
          <div class="osd-progress-bg">
            <div id="osd-progress-fill" class="osd-progress-fill"></div>
          </div>
          <span id="osd-duration" class="osd-time">00:00</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // State
    const video = document.getElementById('main-video');
    const imagePlayer = document.getElementById('image-player');
    const dashboardView = document.getElementById('dashboard-view');
    const playerView = document.getElementById('player-view');
    const playerOsd = document.getElementById('player-osd');
    
    let currentTitle = "";
    let osdTimeout = null;
    let qrInstance = null;

    // Parse URL params passed by MainActivity
    const urlParams = new URLSearchParams(window.location.search);
    const serverIp = urlParams.get('ip') || '127.0.0.1';
    const serverPort = urlParams.get('port') || '8080';
    const deviceName = urlParams.get('name') || 'LightCast TV';
    const fullConnectUrl = `http://${serverIp}:${serverPort}`;

    document.getElementById('tv-device-name').textContent = deviceName;
    document.getElementById('url-label').textContent = fullConnectUrl;
    document.getElementById('ip-info').textContent = `Connesso alla rete locale • ${fullConnectUrl}`;

    // Render Offline QR Code
    try {
      qrInstance = new QRCode(document.getElementById('qrcode-container'), {
        text: fullConnectUrl,
        width: 190,
        height: 190,
        colorDark: "#0d0f17",
        colorLight: "#ffffff",
        correctLevel: 2
      });
    } catch (e) {
      console.error("QR Code Error:", e);
    }

    // Update Clock & Date
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('it-IT', options);
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Anti-Burn-in micro drift (shifts every 45s by +-12px)
    setInterval(() => {
      if (playerView.style.display !== 'block') {
        const dx = (Math.random() * 24 - 12).toFixed(1);
        const dy = (Math.random() * 24 - 12).toFixed(1);
        dashboardView.style.transform = `translate(${dx}px, ${dy}px)`;
      }
    }, 45000);

    // OSD visibility handler
    function showOsd() {
      playerOsd.classList.add('visible');
      clearTimeout(osdTimeout);
      osdTimeout = setTimeout(() => {
        playerOsd.classList.remove('visible');
      }, 3500);
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec === Infinity) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
    }

    // Video Player event listeners
    video.addEventListener('timeupdate', () => {
      const cur = video.currentTime || 0;
      const dur = video.duration || 0;
      document.getElementById('osd-current-time').textContent = formatTime(cur);
      document.getElementById('osd-duration').textContent = formatTime(dur);
      if (dur > 0) {
        document.getElementById('osd-progress-fill').style.width = `${(cur / dur) * 100}%`;
      }
      notifyBridgeState('playing', cur, dur);
    });

    video.addEventListener('play', () => {
      showOsd();
      notifyBridgeState('playing', video.currentTime, video.duration);
    });

    video.addEventListener('pause', () => {
      showOsd();
      notifyBridgeState('paused', video.currentTime, video.duration);
    });

    video.addEventListener('ended', () => {
      stopPlayback();
    });

    video.addEventListener('error', (e) => {
      console.error('Video playback error', e);
      notifyBridgeState('error', 0, 0);
      setTimeout(stopPlayback, 3000);
    });

    function notifyBridgeState(state, cur, dur) {
      if (window.AndroidBridge && window.AndroidBridge.onPlaybackStateChanged) {
        const json = JSON.stringify({
          state: state,
          currentTime: cur || 0,
          duration: dur || 0,
          title: currentTitle,
          volume: video.volume,
          isMuted: video.muted
        });
        window.AndroidBridge.onPlaybackStateChanged(json);
      }
    }

    // Public API exposed for Android Bridge & Server
    window.playMedia = function(url, title, type) {
      currentTitle = title || 'Streaming Video';
      document.getElementById('osd-media-title').textContent = currentTitle;

      dashboardView.style.display = 'none';
      playerView.style.display = 'block';

      if (type && type.startsWith('image/')) {
        video.style.display = 'none';
        imagePlayer.style.display = 'block';
        imagePlayer.src = url;
        notifyBridgeState('playing', 0, 0);
        showOsd();
      } else {
        imagePlayer.style.display = 'none';
        video.style.display = 'block';
        video.src = url;
        video.play().catch(e => console.error("Play error:", e));
        showOsd();
      }
    };

    window.controlMedia = function(action, value) {
      showOsd();
      switch (action) {
        case 'play':
          video.play();
          break;
        case 'pause':
          video.pause();
          break;
        case 'toggle':
          if (video.paused) video.play(); else video.pause();
          break;
        case 'seek':
          video.currentTime = Math.max(0, Math.min(video.duration || 0, video.currentTime + (value || 10)));
          break;
        case 'seekTo':
          video.currentTime = Math.max(0, Math.min(video.duration || 0, value));
          break;
        case 'volume':
          video.volume = Math.max(0, Math.min(1, value));
          break;
        case 'mute':
          video.muted = !video.muted;
          break;
        case 'stop':
          stopPlayback();
          break;
      }
    };

    function stopPlayback() {
      video.pause();
      video.removeAttribute('src');
      video.load();
      imagePlayer.src = '';
      playerView.style.display = 'none';
      dashboardView.style.display = 'flex';
      notifyBridgeState('idle', 0, 0);
    }
  </script>
</body>
</html>
